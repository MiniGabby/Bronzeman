# Copies everyone's quest progress, levels and achievement diaries from the OSRS Wiki's WikiSync into docs/data/wikisync.json,
# because the website itself isn't allowed to read WikiSync from the browser.
name: Sync WikiSync quests

on:
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours
  workflow_dispatch:          # "Run workflow" button on the Actions tab
  push:
    paths: ["docs/data/players.js"]

permissions:
  contents: write

concurrency:
  group: sync-wikisync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch quests, levels and diaries from WikiSync
        run: node .github/scripts/build-wikisync.js

      - name: Commit if changed
        run: |
          if git diff --quiet -- docs/data/wikisync.json && ! git ls-files --others --exclude-standard -- docs/data/wikisync.json | grep -q .; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/wikisync.json
          git commit -m "Update WikiSync quests"
          git pull --rebase
          git push
