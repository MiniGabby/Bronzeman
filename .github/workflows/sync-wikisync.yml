# Copies everyone's quest progress, levels and achievement diaries from the OSRS Wiki's WikiSync into docs/data/wikisync.json,
# because the website itself isn't allowed to read WikiSync from the browser.
# Also refreshes everyone on Wise Old Man and saves their levels, XP and XP gains to docs/data/wom.json,
# so the website doesn't have to ask Wise Old Man from every visitor's browser.
# The same step keeps docs/data/xp-history.json: one snapshot of everyone's XP per day, kept forever.
# And it adds new unlocks from the bronzeman plugin's database to docs/data/unlocks.json. The database
# address is the secret BRONZEMAN_DB_URL (Settings > Secrets and variables > Actions); without it that step is skipped.
name: Sync WikiSync quests

on:
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours
  workflow_dispatch:          # "Run workflow" button on the Actions tab
  push:
    paths: ["docs/data/players.js", "docs/data/catchup.js"]

permissions:
  contents: write

concurrency:
  group: sync-wikisync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch quests, levels and diaries from WikiSync
        run: node .github/scripts/build-wikisync.js

      - name: Refresh Wise Old Man and save levels, XP and gains
        run: node .github/scripts/build-wom.js

      - name: Add new unlocks from the bronzeman database
        run: node .github/scripts/build-unlocks.js
        env:
          BRONZEMAN_DB_URL: ${{ secrets.BRONZEMAN_DB_URL }}
        continue-on-error: true   # a problem here shouldn't stop the quests and stats from being saved

      - name: Commit if changed
        run: |
          if git diff --quiet -- docs/data/wikisync.json docs/data/wom.json docs/data/xp-history.json docs/data/unlocks.json && ! git ls-files --others --exclude-standard -- docs/data/wikisync.json docs/data/wom.json docs/data/xp-history.json docs/data/unlocks.json | grep -q .; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/wikisync.json docs/data/wom.json docs/data/xp-history.json docs/data/unlocks.json
          git commit -m "Update WikiSync quests, Wise Old Man stats and unlocks"
          git pull --rebase
          git push
